name: CSG bunching

on:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/bunching/**"
      - ".github/workflows/csg-bunching.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  bunching:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: ["2018-19","2019-20","2020-21","2021-22","2022-23","2023-24","2024-25","2025-26"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install "statsmodels>=0.14,<1"
      - run: python studies/composite_school_grant/bunching/run_bunching_year.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-bunching-${{ matrix.year }}
          path: studies/composite_school_grant/outputs/bunching/${{ matrix.year }}/
          retention-days: 14
