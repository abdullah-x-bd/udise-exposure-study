name: CSG four confirmatory experiments

on:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/confirmatory_experiments/**"
      - ".github/workflows/csg-confirmatory-four-experiments.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  confirmatory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - assign: "2021-22"
            future: "2023-24,2024-25,2025-26"
          - assign: "2022-23"
            future: "2024-25,2025-26"
    runs-on: ubuntu-latest
    env:
      ASSIGN_YEAR: ${{ matrix.assign }}
      FUTURE_YEARS: ${{ matrix.future }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run maintenance, need, equivalence, and dynamic-index experiments
        run: python studies/composite_school_grant/confirmatory_experiments/run_confirmatory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-confirmatory-${{ matrix.assign }}
          path: studies/composite_school_grant/outputs/confirmatory/${{ matrix.assign }}/
          retention-days: 14
