name: Build adjusted A0 models

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build complete A0 indicator system
    types:
      - completed

permissions:
  contents: read
  issues: write

concurrency:
  group: adjusted-a0-models
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  GH_TOKEN: ${{ github.token }}
  PIPELINE_ISSUE: "10"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Post domain-native model start
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Domain-native adjusted A0 models started

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Each model reads only the compact indicator domain containing its outcome."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: pytest

  principal:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        outcome:
          - ends_before_class10
          - ends_before_class12
          - no_functional_water_source
          - no_functional_electricity
          - no_internet
          - str_above_30
          - no_female_teacher
          - grant_per_student
          - access_deprivation_index
          - teacher_capacity_deprivation_index
          - institutional_neglect_index
          - overall_multidimensional_deprivation_index
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Estimate principal adjusted model
        run: >-
          python -m udise.domain_native_adjusted
          --task principal
          --outcome "${{ matrix.outcome }}"
          --output "outputs/domain_native_models/principal_${{ matrix.outcome }}"
      - uses: actions/upload-artifact@v4
        with:
          name: adjusted-principal-${{ matrix.outcome }}
          path: outputs/domain_native_models/principal_${{ matrix.outcome }}/
          if-no-files-found: error
          retention-days: 30

  interaction:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        baseline:
          - B0
          - C0
          - D0
          - E0
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Estimate A0-baseline interaction models
        run: >-
          python -m udise.domain_native_adjusted
          --task interaction
          --baseline "${{ matrix.baseline }}"
          --output "outputs/domain_native_models/interaction_${{ matrix.baseline }}"
      - uses: actions/upload-artifact@v4
        with:
          name: adjusted-interaction-${{ matrix.baseline }}
          path: outputs/domain_native_models/interaction_${{ matrix.baseline }}/
          if-no-files-found: error
          retention-days: 30

  calibration:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        baseline:
          - C0
          - D0
          - E0
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Estimate B0 calibration models
        run: >-
          python -m udise.domain_native_adjusted
          --task calibration
          --baseline "${{ matrix.baseline }}"
          --output "outputs/domain_native_models/calibration_${{ matrix.baseline }}"
      - uses: actions/upload-artifact@v4
        with:
          name: adjusted-calibration-${{ matrix.baseline }}
          path: outputs/domain_native_models/calibration_${{ matrix.baseline }}/
          if-no-files-found: error
          retention-days: 30

  state_specific:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        outcome:
          - ends_before_class12
          - str_above_30
          - no_internet
          - teacher_capacity_deprivation_index
          - institutional_neglect_index
          - overall_multidimensional_deprivation_index
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Estimate state-specific within-district association
        run: >-
          python -m udise.domain_native_adjusted
          --task state_specific
          --outcome "${{ matrix.outcome }}"
          --output "outputs/domain_native_models/state_${{ matrix.outcome }}"
      - uses: actions/upload-artifact@v4
        with:
          name: adjusted-state-${{ matrix.outcome }}
          path: outputs/domain_native_models/state_${{ matrix.outcome }}/
          if-no-files-found: error
          retention-days: 30

  complete:
    if: always()
    needs:
      - test
      - principal
      - interaction
      - calibration
      - state_specific
    runs-on: ubuntu-latest
    steps:
      - name: Report model status
        run: |
          TEST='${{ needs.test.result }}'
          PRINCIPAL='${{ needs.principal.result }}'
          INTERACTION='${{ needs.interaction.result }}'
          CALIBRATION='${{ needs.calibration.result }}'
          STATE='${{ needs.state_specific.result }}'
          if [[ "$TEST" == "success" && "$PRINCIPAL" == "success" && "$INTERACTION" == "success" && "$CALIBRATION" == "success" && "$STATE" == "success" ]]; then
            gh issue comment "$PIPELINE_ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --body "### Domain-native adjusted A0 model system succeeded

            Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

            Principal state- and district-fixed-effect models, every A0-baseline interaction family, B0 calibration models and state-specific within-district associations have completed."
            exit 0
          fi
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Domain-native adjusted A0 model system has failed components

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          test=$TEST
          principal=$PRINCIPAL
          interaction=$INTERACTION
          calibration=$CALIBRATION
          state_specific=$STATE"
          exit 1
