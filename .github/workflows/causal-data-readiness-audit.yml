name: Causal data readiness audit

on:
  workflow_dispatch:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/causal_identification/run_data_readiness_audit.py"
      - ".github/workflows/causal-data-readiness-audit.yml"

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "huggingface_hub>=0.34,<1"
      - run: python studies/causal_identification/run_data_readiness_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-data-readiness-audit
          path: studies/causal_identification/outputs/
          retention-days: 14
