name: Muslim equity fast PyHDFE inspection

on:
  push:
    branches:
      - research/muslim-government-school-equity
    paths:
      - .github/workflows/muslim-equity-pyhdfe-inspection.yml
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install estimator dependencies
        run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Compile fast inspection programs
        run: |
          python -m py_compile \
            studies/muslim_government_school_equity/run_need_inspection_pyhdfe.py \
            studies/muslim_government_school_equity/combine_need_inspection_pyhdfe.py
      - name: Validate PyHDFE against existing absorber
        run: |
          PYTHONPATH=studies/muslim_government_school_equity python - <<'PY'
          import numpy as np
          import pyhdfe
          from common import absorb

          rng = np.random.default_rng(20260817)
          n = 5000
          school = rng.integers(0, 700, n)
          dy = rng.integers(0, 80, n)
          z = rng.normal(size=(n, 6))
          old = absorb(z, np.ones(n), [school, dy], max_iter=500, tol=1e-11)
          alg = pyhdfe.create(
              np.column_stack([dy, school]),
              drop_singletons=False,
              compute_degrees=False,
              residualize_method="sw",
          )
          new = alg.residualize(z)
          diff = float(np.max(np.abs(old - new)))
          print(f"max residualization difference={diff:.3e}")
          assert diff < 1e-7
          PY
      - name: Verify data access
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_DATASET_REPO"

  primary:
    name: PyHDFE primary plus district-cluster
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Run primary PyHDFE inspection family
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_need_inspection_pyhdfe.py primary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-pyhdfe-primary
          path: studies/muslim_government_school_equity/outputs/need_inspection_pyhdfe/primary/*
          retention-days: 30
          if-no-files-found: error

  current:
    name: PyHDFE contemporaneous-exposure robustness
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Run contemporaneous-exposure PyHDFE family
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_need_inspection_pyhdfe.py current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-pyhdfe-current
          path: studies/muslim_government_school_equity/outputs/need_inspection_pyhdfe/current/*
          retention-days: 30
          if-no-files-found: error

  core:
    name: PyHDFE core-government robustness
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Run core-government PyHDFE family
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_need_inspection_pyhdfe.py core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-pyhdfe-core
          path: studies/muslim_government_school_equity/outputs/need_inspection_pyhdfe/core/*
          retention-days: 30
          if-no-files-found: error

  combine:
    name: Combine and FDR-correct inspection results
    needs: [primary, current, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - uses: actions/download-artifact@v4
        with:
          name: inspection-pyhdfe-primary
          path: /tmp/inspection-primary
      - uses: actions/download-artifact@v4
        with:
          name: inspection-pyhdfe-current
          path: /tmp/inspection-current
      - uses: actions/download-artifact@v4
        with:
          name: inspection-pyhdfe-core
          path: /tmp/inspection-core
      - name: Combine model families and apply primary-family FDR
        run: |
          PYTHONPATH=studies/muslim_government_school_equity python \
            studies/muslim_government_school_equity/combine_need_inspection_pyhdfe.py \
            /tmp/inspection-primary /tmp/inspection-current /tmp/inspection-core
      - uses: actions/upload-artifact@v4
        with:
          name: muslim-equity-inspection-final
          path: studies/muslim_government_school_equity/outputs/need_inspection_final/*
          retention-days: 30
          if-no-files-found: error
