name: Build private UDISE processed data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-data.yml"
      - "src/udise/build_data.py"
      - "config/data_types.yml"
      - "config/dataset.yml"
      - "config/expected_schema.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: build-private-udise-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      PYTHONUNBUFFERED: "1"
      PIPELINE_ISSUE: "3"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Post build start
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Processing run started

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Commit: \`$GITHUB_SHA\`

          The pipeline is converting all six private UDISE+ source archives to typed Parquet and building the DuckDB database."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run configuration tests
        run: pytest tests/test_build_configuration.py

      - name: Show runner capacity
        run: |
          free -h
          df -h .

      - name: Build typed Parquet and DuckDB outputs
        run: >-
          python -m udise.build_data
          --dataset-config config/dataset.yml
          --schema config/expected_schema.yml
          --types config/data_types.yml
          --output outputs/build

      - name: Upload aggregate processing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udise-2024-25-processing-report
          path: outputs/build/manifests/
          if-no-files-found: warn
          retention-days: 30

      - name: Post successful build report
        if: success()
        run: |
          {
            echo "### Processing run succeeded"
            echo
            cat outputs/build/manifests/build_report.md
            echo
            echo "Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
          } > /tmp/pipeline-success.md
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/pipeline-success.md

      - name: Post failed build report
        if: failure()
        run: |
          {
            echo "### Processing run failed"
            echo
            echo "Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "The failure logs will be inspected and corrected before the pipeline is rerun."
          } > /tmp/pipeline-failure.md
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/pipeline-failure.md

      - name: Show final runner capacity
        if: always()
        run: df -h .
