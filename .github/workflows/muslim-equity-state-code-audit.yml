name: Muslim equity state-code audit

on:
  push:
    branches:
      - research/muslim-government-school-equity
    paths:
      - .github/workflows/muslim-equity-state-code-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Audit state identifiers across years
        run: |
          PYTHONPATH=studies/muslim_government_school_equity python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          import duckdb
          import common

          repo = os.environ['HF_DATASET_REPO']
          token = os.environ['HF_TOKEN']
          con = duckdb.connect()
          out = []
          with tempfile.TemporaryDirectory(prefix='state_code_audit_') as td:
              root = Path(td)
              for year in common.YEARS:
                  paths = common.extract_archive(repo, token, year, 'profile_1', root)
                  src = common.csv_source(paths)
                  cols = common.source_columns(con, src)
                  rec = {'year': year, 'candidates': {}}
                  for key in ('state','state_id','state_code','state_cd'):
                      if key not in cols:
                          continue
                      col = common.qid(cols[key])
                      vals = [r[0] for r in con.execute(
                          f"SELECT DISTINCT NULLIF(TRIM(CAST({col} AS VARCHAR)), '') v FROM {src} WHERE v IS NOT NULL ORDER BY v"
                      ).fetchall()]
                      rec['candidates'][key] = {'n': len(vals), 'values': vals}
                  out.append(rec)
                  print(year, json.dumps(rec, ensure_ascii=False), flush=True)
          Path('state_code_audit.json').write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: muslim-equity-state-code-audit
          path: state_code_audit.json
          retention-days: 14
