name: CSG social equity joint pooled

on:
  workflow_dispatch:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/social_equity/run_joint_pooled.py"
      - ".github/workflows/csg-social-equity-joint-pooled.yml"

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  pooled:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install "pandas>=2.2,<3" "scipy>=1.14,<2" "statsmodels>=0.14,<1"
      - name: Remove transpose placeholders
        run: |
          sed -i '/d\["Tz"\] = d.T \* 0/d' studies/composite_school_grant/social_equity/run_social_equity.py
          sed -i "s/;d\['Tz'\]=d.T\*0//" studies/composite_school_grant/social_equity/run_joint_composition.py
      - run: python studies/composite_school_grant/social_equity/run_joint_pooled.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-social-joint-pooled
          path: |
            studies/composite_school_grant/outputs/social_equity_joint_pooled/*.csv
            studies/composite_school_grant/outputs/social_equity_joint_pooled/*.json
            studies/composite_school_grant/outputs/social_equity_joint_pooled/RESULTS.md
          retention-days: 14
