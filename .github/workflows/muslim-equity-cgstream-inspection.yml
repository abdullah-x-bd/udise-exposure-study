name: Muslim equity streamed CG inspection

on:
  push:
    branches:
      - research/muslim-government-school-equity
    paths:
      - .github/workflows/muslim-equity-cgstream-inspection.yml
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Compile streamed CG runner
        run: |
          python -m py_compile \
            studies/muslim_government_school_equity/run_need_inspection_cgstream.py \
            studies/muslim_government_school_equity/combine_need_inspection_fastcodes.py
      - name: Validate symmetric-CG residualization against original absorber
        run: |
          PYTHONPATH=studies/muslim_government_school_equity python - <<'PY'
          import numpy as np
          import pyhdfe
          from common import absorb

          rng = np.random.default_rng(20260817)
          n = 30000
          school = rng.integers(0, 4200, n, dtype=np.int32)
          dy = rng.integers(0, 350, n, dtype=np.int32)
          z = rng.normal(size=(n, 7))
          old = absorb(z, np.ones(n), [school, dy], max_iter=1000, tol=1e-11)
          ids = np.column_stack([dy, school]).astype(np.int32, copy=False)
          alg = pyhdfe.create(
              ids,
              drop_singletons=False,
              compute_degrees=False,
              residualize_method="map",
              options={
                  "transform": "symmetric",
                  "acceleration": "cg",
                  "tol": 1e-10,
                  "iteration_limit": 10000,
              },
          )
          new = alg.residualize(z)
          diff = float(np.max(np.abs(old - new)))
          print(f"max residualization difference={diff:.3e}")
          assert diff < 1e-7
          PY
      - name: Verify data access
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_DATASET_REPO"

  primary:
    name: CG-stream primary plus district-cluster
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Run primary streamed-CG family
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_need_inspection_cgstream.py primary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-cgstream-primary
          path: studies/muslim_government_school_equity/outputs/need_inspection_fastcodes/primary/*
          retention-days: 30
          if-no-files-found: error

  current:
    name: CG-stream contemporaneous-exposure robustness
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Run contemporaneous streamed-CG family
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_need_inspection_cgstream.py current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-cgstream-current
          path: studies/muslim_government_school_equity/outputs/need_inspection_fastcodes/current/*
          retention-days: 30
          if-no-files-found: error

  core:
    name: CG-stream core-government robustness
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3" "pyhdfe==0.2.0"
      - name: Run core streamed-CG family
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_need_inspection_cgstream.py core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-cgstream-core
          path: studies/muslim_government_school_equity/outputs/need_inspection_fastcodes/core/*
          retention-days: 30
          if-no-files-found: error

  combine:
    name: Combine and FDR-correct streamed-CG results
    needs: [primary, current, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - uses: actions/download-artifact@v4
        with:
          name: inspection-cgstream-primary
          path: /tmp/inspection-primary
      - uses: actions/download-artifact@v4
        with:
          name: inspection-cgstream-current
          path: /tmp/inspection-current
      - uses: actions/download-artifact@v4
        with:
          name: inspection-cgstream-core
          path: /tmp/inspection-core
      - name: Combine model families and apply primary-family FDR
        run: |
          PYTHONPATH=studies/muslim_government_school_equity python \
            studies/muslim_government_school_equity/combine_need_inspection_fastcodes.py \
            /tmp/inspection-primary /tmp/inspection-current /tmp/inspection-core
      - uses: actions/upload-artifact@v4
        with:
          name: muslim-equity-inspection-final-cgstream
          path: studies/muslim_government_school_equity/outputs/need_inspection_final/*
          retention-days: 30
          if-no-files-found: error
