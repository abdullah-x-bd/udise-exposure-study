name: Muslim government school equity national experiments

on:
  push:
    branches:
      - research/muslim-government-school-equity
    paths:
      - ".github/workflows/muslim-government-school-equity-national.yml"
  workflow_dispatch:

concurrency:
  group: muslim-government-school-equity-national-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  integrity:
    name: Final launch integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - run: python -m py_compile studies/muslim_government_school_equity/*.py
      - run: |
          test -n "$HF_TOKEN"
          test -n "$HF_DATASET_REPO"
          test -f studies/composite_school_grant/scripts/03_build_panel.py

  baseline:
    name: Government-school national baseline
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - run: python studies/muslim_government_school_equity/run_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-equity-national-baseline
          path: studies/muslim_government_school_equity/outputs/baseline/*
          retention-days: 30
          if-no-files-found: error

  rte_staffing:
    name: RTE staffing national experiment
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - run: python studies/muslim_government_school_equity/run_rte_staffing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-equity-rte-staffing-national
          path: studies/muslim_government_school_equity/outputs/rte_staffing/*
          retention-days: 30
          if-no-files-found: error

  failure_to_repair:
    name: Failure-to-repair national experiment
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - run: python studies/muslim_government_school_equity/run_failure_to_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-equity-failure-repair-national
          path: studies/muslim_government_school_equity/outputs/failure_to_repair/*
          retention-days: 30
          if-no-files-found: error

  need_to_inspection:
    name: Need-to-inspection national experiment
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - run: python studies/muslim_government_school_equity/run_need_inspection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-equity-need-inspection-national
          path: studies/muslim_government_school_equity/outputs/need_inspection/*
          retention-days: 30
          if-no-files-found: error
