name: CSG timing core

on:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/timing_core/**"
      - ".github/workflows/csg-timing-core.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  timing-core:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install "pandas>=2.2,<3" "scipy>=1.14,<2" "rdrobust>=1.3,<2"
      - name: Run eight-year timing core
        run: python studies/composite_school_grant/timing_core/run_timing_core.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-timing-core
          path: studies/composite_school_grant/outputs/timing_core/
          retention-days: 14
