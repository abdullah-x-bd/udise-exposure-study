name: CSG timing and incentives full program

on:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/timing_incentives/**"
      - ".github/workflows/csg-timing-incentives-full.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  full-program:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install "pandas>=2.2,<3" "scipy>=1.14,<2" "statsmodels>=0.14,<1" "rdrobust>=1.3,<2"
      - name: Run complete CSG timing, bunching and incentives program
        run: python studies/composite_school_grant/timing_incentives/run_full_program.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-timing-incentives-full
          path: studies/composite_school_grant/outputs/timing_incentives/
          retention-days: 14
