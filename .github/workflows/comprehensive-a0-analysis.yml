name: Build complete A0 indicator system

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/comprehensive-a0-analysis.yml"
      - "src/udise/domain_native_a0.py"
      - "src/udise/indicator_registry.py"
      - "src/udise/comprehensive_a0_analysis.py"
      - "tests/test_domain_native_a0.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: comprehensive-a0-analysis
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  GH_TOKEN: ${{ github.token }}
  PIPELINE_ISSUE: "10"
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Post domain-native analysis start
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Domain-native complete A0 analysis started

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          The analysis now uses a compact social foundation and separate indicator-domain files. No runner constructs the former 11.7 GiB wide temporary table."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: pytest

  foundation:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Show runner capacity
        run: |
          free -h
          df -h .
      - name: Build compact private social foundation
        run: >-
          python -m udise.domain_native_a0 foundation
          --output outputs/domain_native_a0
          --upload
      - uses: actions/upload-artifact@v4
        with:
          name: a0-social-foundation-report
          path: |
            outputs/domain_native_a0/foundation/foundation_manifest.json
            outputs/domain_native_a0/foundation/foundation_report.md
          if-no-files-found: error
          retention-days: 30

  source:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Analyse every direct source column and social composition
        run: >-
          python -m udise.domain_native_a0 source
          --output outputs/domain_native_a0
      - uses: actions/upload-artifact@v4
        with:
          name: a0-primary-source-and-composition
          path: outputs/domain_native_a0/source/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  domain:
    needs: foundation
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        domain:
          - access
          - infrastructure
          - wash
          - learning_environment
          - digital
          - teachers
          - governance
          - welfare
          - inclusion
          - vulnerability
          - age_grade
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Build and analyse bounded indicator domain
        run: >-
          python -m udise.domain_native_a0 domain
          --domain "${{ matrix.domain }}"
          --output outputs/domain_native_a0
          --upload
      - uses: actions/upload-artifact@v4
        with:
          name: a0-domain-${{ matrix.domain }}-2024-25
          path: |
            outputs/domain_native_a0/domains/${{ matrix.domain }}/domain_manifest.json
            outputs/domain_native_a0/domains/${{ matrix.domain }}/analysis/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  tertiary:
    needs: domain
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Build and analyse tertiary structural indicators
        run: >-
          python -m udise.domain_native_a0 tertiary
          --output outputs/domain_native_a0
          --upload
      - uses: actions/upload-artifact@v4
        with:
          name: a0-domain-tertiary-2024-25
          path: |
            outputs/domain_native_a0/domains/tertiary/domain_manifest.json
            outputs/domain_native_a0/domains/tertiary/analysis/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  complete:
    if: always()
    needs:
      - test
      - foundation
      - source
      - domain
      - tertiary
    runs-on: ubuntu-latest
    steps:
      - name: Report complete analysis status
        run: |
          TEST='${{ needs.test.result }}'
          FOUNDATION='${{ needs.foundation.result }}'
          SOURCE='${{ needs.source.result }}'
          DOMAIN='${{ needs.domain.result }}'
          TERTIARY='${{ needs.tertiary.result }}'
          if [[ "$TEST" == "success" && "$FOUNDATION" == "success" && "$SOURCE" == "success" && "$DOMAIN" == "success" && "$TERTIARY" == "success" ]]; then
            gh issue comment "$PIPELINE_ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --body "### Domain-native complete A0 analysis succeeded

            Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

            Every direct source column, every supported secondary indicator, all fifteen tertiary indicators, all A0-baseline gaps, all pairwise comparisons, national and state concentration gradients, district comparisons, interaction grids, fixed-effect associations and the complete domain graph library have been produced."
            exit 0
          fi
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Domain-native complete A0 analysis has failed components

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          test=$TEST
          foundation=$FOUNDATION
          source=$SOURCE
          domains=$DOMAIN
          tertiary=$TERTIARY"
          exit 1
