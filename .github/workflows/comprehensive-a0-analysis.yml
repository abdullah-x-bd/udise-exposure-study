name: Build complete A0 indicator system

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/comprehensive-a0-analysis.yml"
      - "src/udise/indicator_registry.py"
      - "src/udise/comprehensive_a0_analysis.py"
      - "src/udise/comprehensive_a0_staged.py"
      - "tests/test_indicator_registry.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: comprehensive-a0-analysis
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  GH_TOKEN: ${{ github.token }}
  PIPELINE_ISSUE: "10"
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  build-indicator-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Post staged-run start
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Corrected staged A0 run started

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Phase 1 builds the school indicator table with a 4 GB DuckDB memory cap and uploads a private Parquet checkpoint. Phase 2 calculates aggregate comparisons and figures in bounded indicator batches."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: pytest

      - name: Show runner capacity
        run: |
          free -h
          df -h .

      - name: Build and upload private school-indicator checkpoint
        run: >-
          python -m udise.comprehensive_a0_staged build
          --output outputs/comprehensive_a0

      - name: Upload foundational aggregate tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-a0-build-foundation
          path: |
            outputs/comprehensive_a0/tables/indicator_catalog.csv
            outputs/comprehensive_a0/tables/primary_numeric_summary.csv
            outputs/comprehensive_a0/tables/dcf_raw_code_audit.csv
            outputs/comprehensive_a0/tables/national_stage_representation.csv
            outputs/comprehensive_a0/tables/state_stage_representation.csv
            outputs/comprehensive_a0/tables/national_teacher_social_category_representation.csv
            outputs/comprehensive_a0/tables/state_teacher_social_category_representation.csv
            outputs/comprehensive_a0/build_manifest.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Post build-phase failure
        if: failure()
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Corrected A0 build phase failed

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          The failure is isolated to the school-indicator checkpoint phase. Aggregate calculations did not start."

      - name: Show final build capacity
        if: always()
        run: |
          free -h
          df -h .

  aggregate-and-figure:
    needs: build-indicator-checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Download foundational tables
        uses: actions/download-artifact@v4
        with:
          name: comprehensive-a0-build-foundation
          path: outputs/comprehensive_a0

      - name: Show runner capacity
        run: |
          free -h
          df -h .

      - name: Build all comparisons and figures in batches
        run: >-
          python -m udise.comprehensive_a0_staged aggregate
          --output outputs/comprehensive_a0

      - name: Upload complete aggregate outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-a0-analysis-2024-25
          path: |
            outputs/comprehensive_a0/tables/
            outputs/comprehensive_a0/figures/
            outputs/comprehensive_a0/comprehensive_a0_report.md
            outputs/comprehensive_a0/build_manifest.json
            outputs/comprehensive_a0/analysis_manifest.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      - name: Post successful report
        if: success()
        run: |
          {
            echo "### Complete staged A0 indicator run succeeded"
            echo
            cat outputs/comprehensive_a0/comprehensive_a0_report.md
            echo
            echo "The artifact contains the indicator catalog, all national and state baseline tables, district profiles, interaction grids, fixed-effect associations and the complete graph library."
            echo
            echo "The school-level indicator Parquet checkpoint remains in the private Hugging Face dataset."
            echo
            echo "Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comprehensive-success.md
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/comprehensive-success.md

      - name: Post aggregate-phase failure
        if: failure()
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Corrected A0 aggregate phase failed

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          The private school-indicator checkpoint completed successfully. The failure is isolated to one aggregate or figure batch and can be resumed without rebuilding the raw data layer."

      - name: Show final aggregate capacity
        if: always()
        run: |
          free -h
          df -h .
