name: BharatNet DPI study diagnostic

on:
  push:
    branches:
      - research/bharatnet-dpi-study
    paths:
      - ".github/workflows/bharatnet-dpi-diagnostic.yml"
      - "src/udise/hf_inventory.py"
      - "src/udise/bharatnet_probe.py"
      - "src/udise/bharatnet_udise_baseline.py"
      - "src/udise/bbnl_archive_probe.py"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Inspect private dataset inventory
        run: python -m udise.hf_inventory
      - name: Probe official BharatNet OGD resources
        run: python -m udise.bharatnet_probe
      - name: Inspect archived BBNL service-ready data
        run: python -m udise.bbnl_archive_probe
      - name: Build UDISE digital-capability baseline
        run: python -m udise.bharatnet_udise_baseline
      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bharatnet-dpi-diagnostics
          path: outputs/bharatnet_dpi/
          retention-days: 7
