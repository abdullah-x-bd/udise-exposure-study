name: CSG new 2025-26 channels
on:
  push:
    branches: [research/composite-school-grant-study]
    paths: [".github/workflows/csg-new-2025-channels.yml"]
permissions:
  contents: read
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"
  CSG_SCREEN_VERSION: "2-materialized"
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        assign: ["2021-22", "2022-23"]
    runs-on: ubuntu-latest
    env:
      ASSIGN_YEAR: ${{ matrix.assign }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Screen new 2025-26 facility, safety, and profile fields
        run: python studies/composite_school_grant/scripts/09_new_2025_channels.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-new-2025-v2-${{ matrix.assign }}
          path: studies/composite_school_grant/outputs/new_2025_channels/${{ matrix.assign }}_to_2025-26/
          retention-days: 14
