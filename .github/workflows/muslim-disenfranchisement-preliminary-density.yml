name: Muslim educational disenfranchisement preliminary state density

on:
  push:
    branches:
      - research/muslim-government-school-equity
    paths:
      - ".github/workflows/muslim-disenfranchisement-preliminary-density.yml"
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  state_density:
    name: State Muslim-share density ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year:
          - "2018-19"
          - "2019-20"
          - "2020-21"
          - "2021-22"
          - "2022-23"
          - "2023-24"
          - "2024-25"
          - "2025-26"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/muslim-government-school-equity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - run: python -m py_compile studies/muslim_educational_disenfranchisement/preliminary_state_density.py
      - name: Build state density outputs
        env:
          YEAR: ${{ matrix.year }}
        run: python studies/muslim_educational_disenfranchisement/preliminary_state_density.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-disenfranchisement-state-density-${{ matrix.year }}
          path: studies/muslim_educational_disenfranchisement/outputs/preliminary_density/${{ matrix.year }}/*
          retention-days: 30
          if-no-files-found: warn
