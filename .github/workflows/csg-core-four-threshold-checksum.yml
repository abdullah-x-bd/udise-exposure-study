name: CSG four-threshold core checksum
on:
  push:
    branches: [research/composite-school-grant-study]
    paths: [.github/workflows/csg-core-four-threshold-checksum.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"
jobs:
  checksum:
    strategy:
      fail-fast: false
      matrix:
        assignment_year: ["2019-20","2020-21","2021-22","2022-23"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "rdrobust==1.3.0" "pandas>=2.2,<3"
      - env:
          ASSIGN_YEAR: ${{ matrix.assignment_year }}
        run: python studies/composite_school_grant/full_formula_audit/run_core_checksum.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-checksum-${{ matrix.assignment_year }}
          path: studies/composite_school_grant/outputs/formula_checksum/${{ matrix.assignment_year }}/checksum.csv
          retention-days: 14
