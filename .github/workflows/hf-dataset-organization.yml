name: Hugging Face dataset organization

on:
  push:
    branches:
      - research/bharatnet-dpi-study
    paths:
      - ".github/workflows/hf-dataset-organization.yml"
      - "src/udise/hf_dataset_organization.py"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Organize raw UDISE archives and build schema manifest
        run: python -m udise.hf_dataset_organization --mode organize
      - name: Verify organized repository layout
        run: python -m udise.hf_dataset_organization --mode verify
      - name: Upload organization audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-dataset-organization-audit
          path: outputs/hf_dataset_organization/
          retention-days: 14
