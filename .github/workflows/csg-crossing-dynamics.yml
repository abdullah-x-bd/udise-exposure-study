name: CSG crossing dynamics

on:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/crossing_dynamics/**"
      - ".github/workflows/csg-crossing-dynamics.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  crossing:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        start: ["2018-19","2019-20","2020-21","2021-22","2022-23","2023-24"]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      START_YEAR: ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install "pandas>=2.2,<3"
      - run: python studies/composite_school_grant/crossing_dynamics/run_transition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-crossing-${{ matrix.start }}
          path: studies/composite_school_grant/outputs/crossing_dynamics/${{ matrix.start }}/
          retention-days: 14
