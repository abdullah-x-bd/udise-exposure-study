name: Render CSG formula fingerprint in R

on:
  workflow_dispatch:
  push:
    branches:
      - research/composite-school-grant-study
    paths:
      - 'studies/composite_school_grant/figures/flagship_formula_fingerprint.R'
      - '.github/workflows/csg-r-fingerprint-example.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research/composite-school-grant-study

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c('ggplot2', 'dplyr', 'tibble', 'svglite'))

      - name: Render fingerprint figure
        run: Rscript studies/composite_school_grant/figures/flagship_formula_fingerprint.R

      - name: Upload rendered outputs
        uses: actions/upload-artifact@v4
        with:
          name: csg-formula-fingerprint-r
          path: |
            studies/composite_school_grant/figures/rendered/csg_formula_fingerprint_R.png
            studies/composite_school_grant/figures/rendered/csg_formula_fingerprint_R.svg
          if-no-files-found: error
