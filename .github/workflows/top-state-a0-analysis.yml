name: Build top-five state A0 analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/top-state-a0-analysis.yml"
      - "src/udise/top_state_a0_analysis.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: top-five-state-a0-analysis
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      GH_TOKEN: ${{ github.token }}
      PIPELINE_ISSUE: "10"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Post state-analysis start
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Top-five state A0 analysis started

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          The run is calculating A0-B0/C0/D0/E0 baselines and 0% to above-75% concentration gradients for the most damaging indicators in Bihar, Uttar Pradesh, Jharkhand, Uttarakhand and Assam."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: pytest

      - name: Build top-five state analysis
        run: >-
          python -m udise.top_state_a0_analysis
          --output outputs/top_five_states

      - name: Upload state-analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-five-state-a0-analysis-2024-25
          path: |
            outputs/top_five_states/tables/
            outputs/top_five_states/analysis_manifest.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      - name: Post successful report
        if: success()
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Top-five state A0 analysis succeeded

          The artifact contains five-group baseline exposures, A0-baseline gaps, all-group concentration gradients and A0 changes from the above-0-to-5% band to the above-75% band.

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"

      - name: Post failed report
        if: failure()
        run: |
          gh issue comment "$PIPELINE_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "### Top-five state A0 analysis failed

          Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          The logs will be inspected and corrected before the state findings are reported."
