name: CSG first-stage pilot
on:
  push:
    branches: [research/composite-school-grant-study]
    paths: [".github/workflows/csg-first-stage-pilot.yml"]
permissions:
  contents: read
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run government-school 2022-23 enrolment to 2024-25 CSG first stage
        run: python tools/csg_first_stage_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-first-stage-pilot-government
          path: outputs/csg_first_stage_pilot/
          retention-days: 14
