name: Muslim equity fixed RTE crossing event study

on:
  push:
    branches:
      - research/muslim-government-school-equity
    paths:
      - .github/workflows/muslim-equity-rte-crossing-fix.yml
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  rte_crossing_fixed:
    name: Fixed RTE first-crossing event study
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - name: Validate source-native cutoff alias fix
        run: |
          python -m py_compile studies/muslim_government_school_equity/run_rte_crossing_eventstudy.py
          PYTHONPATH=studies/muslim_government_school_equity python - <<'PY'
          from pathlib import Path
          import duckdb
          p = Path('studies/muslim_government_school_equity/run_rte_crossing_eventstudy.py')
          s = p.read_text(encoding='utf-8')
          assert 'c.column0' not in s
          assert 'AS c(cutoff)' in s
          con = duckdb.connect()
          got = con.execute('SELECT c.cutoff FROM (VALUES (60.5),(90.5),(120.5)) AS c(cutoff) ORDER BY 1').fetchall()
          assert got == [(60.5,), (90.5,), (120.5,)]
          print('cutoff alias smoke test passed:', got)
          PY
      - name: Run fixed RTE first-crossing event study
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_rte_crossing_eventstudy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-equity-rte-crossing-eventstudy-fixed-v2
          path: studies/muslim_government_school_equity/outputs/rte_crossing_eventstudy/*
          retention-days: 30
          if-no-files-found: error
