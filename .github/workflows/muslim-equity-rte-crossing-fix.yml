name: Muslim equity fixed RTE crossing event study

on:
  push:
    branches:
      - research/muslim-government-school-equity
    paths:
      - .github/workflows/muslim-equity-rte-crossing-fix.yml
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  rte_crossing_fixed:
    name: Fixed RTE first-crossing event study
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2,<3"
      - name: Patch DuckDB VALUES alias and compile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('studies/muslim_government_school_equity/run_rte_crossing_eventstudy.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('c.column0 AS cutoff', 'c.cutoff AS cutoff')
          s = s.replace('c.column0)', 'c.cutoff)')
          s = s.replace('c.column0)<=20', 'c.cutoff)<=20')
          s = s.replace('CROSS JOIN (VALUES {cut_values}) c', 'CROSS JOIN (VALUES {cut_values}) AS c(cutoff)')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile studies/muslim_government_school_equity/run_rte_crossing_eventstudy.py
      - name: Run fixed RTE first-crossing event study
        run: PYTHONPATH=studies/muslim_government_school_equity python studies/muslim_government_school_equity/run_rte_crossing_eventstudy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muslim-equity-rte-crossing-eventstudy-fixed
          path: studies/muslim_government_school_equity/outputs/rte_crossing_eventstudy/*
          retention-days: 30
          if-no-files-found: error
