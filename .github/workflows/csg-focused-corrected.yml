name: CSG focused corrected inference
on:
  push:
    branches: [research/composite-school-grant-study]
    paths: [".github/workflows/csg-focused-corrected.yml"]
permissions:
  contents: read
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
jobs:
  corrected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run corrected state-FE focused study
        run: python tools/run_csg_focused_corrected.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-focused-corrected-results
          path: outputs/csg_focused_2022_2024_corrected/
          retention-days: 14
