name: CSG state lag fingerprint

on:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/state_lag/**"
      - ".github/workflows/csg-state-lag.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  state-lag:
    strategy:
      fail-fast: false
      matrix:
        assign: ["2019-20","2020-21","2021-22","2022-23"]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ASSIGN_YEAR: ${{ matrix.assign }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install "pandas>=2.2,<3"
      - run: python studies/composite_school_grant/state_lag/run_state_lag.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-state-lag-${{ matrix.assign }}
          path: studies/composite_school_grant/outputs/state_lag/${{ matrix.assign }}/
          retention-days: 14
