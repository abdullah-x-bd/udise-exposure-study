name: Composite School Grant study

on:
  push:
    branches:
      - research/composite-school-grant-study
    paths:
      - "studies/composite_school_grant/**"
      - ".github/workflows/composite-school-grant-study.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  full-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Probe all eight UDISE schemas
        run: python studies/composite_school_grant/scripts/01_schema_probe.py
      - name: Profile grant and facility encodings
        run: python studies/composite_school_grant/scripts/02_profile_encodings.py
      - name: Inspect enrolment coding across vintages
        run: python studies/composite_school_grant/scripts/02b_enrolment_encodings.py
      - name: Build harmonized eight-year panel
        run: python studies/composite_school_grant/scripts/03_build_panel.py
      - name: Diagnose grant assignment rule and enrolment lag
        run: python studies/composite_school_grant/scripts/04_assignment_diagnostics.py
      - name: Run multi-cutoff RD, pre-treatment, density, and placebo analyses
        run: python studies/composite_school_grant/scripts/05_rd_analysis.py
      - name: Upload study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-school-grant-full-study
          path: |
            studies/composite_school_grant/outputs/
            !studies/composite_school_grant/outputs/panel/**/*.parquet
          retention-days: 14
