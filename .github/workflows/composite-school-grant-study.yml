name: Composite School Grant study

on:
  push:
    branches:
      - research/composite-school-grant-study
    paths:
      - "studies/composite_school_grant/**"
      - ".github/workflows/composite-school-grant-study.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  schema-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Probe all eight UDISE schemas
        run: python studies/composite_school_grant/scripts/01_schema_probe.py
      - name: Upload schema probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-school-grant-schema-probe
          path: studies/composite_school_grant/outputs/schema_probe/
          retention-days: 14
