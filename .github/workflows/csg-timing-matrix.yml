name: CSG timing matrix

on:
  push:
    branches: [research/composite-school-grant-study]
    paths:
      - "studies/composite_school_grant/timing_matrix/**"
      - ".github/workflows/csg-timing-matrix.yml"

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  PYTHONUNBUFFERED: "1"

jobs:
  timing:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        assign: ["2018-19","2019-20","2020-21","2021-22","2022-23","2023-24","2024-25","2025-26"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ASSIGN_YEAR: ${{ matrix.assign }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install "pandas>=2.2,<3" "scipy>=1.14,<2" "rdrobust>=1.3,<2"
      - name: Run cohort timing matrix
        run: python studies/composite_school_grant/timing_matrix/run_one_assignment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csg-timing-${{ matrix.assign }}
          path: studies/composite_school_grant/outputs/timing_matrix/${{ matrix.assign }}/
          retention-days: 14
